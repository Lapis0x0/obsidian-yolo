name: Update download statistics

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Load previous Cloudflare ledger
        run: |
          if git fetch origin download-metrics:refs/remotes/origin/download-metrics; then
            git show origin/download-metrics:download-stats.json > /tmp/download-stats.json
          fi

      - name: Update download totals
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          node scripts/download-stats.mjs
          --state /tmp/download-stats.json
          --output-dir /tmp/download-metrics-output

      - name: Publish Badge data branch
        run: |
          worktree=/tmp/download-metrics-worktree
          if git show-ref --verify --quiet refs/remotes/origin/download-metrics; then
            git worktree add --detach "$worktree" origin/download-metrics
            git -C "$worktree" switch -C download-metrics origin/download-metrics
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" switch --orphan download-metrics
            git -C "$worktree" rm -rf --ignore-unmatch .
          fi
          cp /tmp/download-metrics-output/download-stats.json "$worktree/download-stats.json"
          cp /tmp/download-metrics-output/badge.json "$worktree/badge.json"
          touch "$worktree/.nojekyll"
          git -C "$worktree" add download-stats.json badge.json .nojekyll
          if git -C "$worktree" diff --cached --quiet; then
            exit 0
          fi
          git -C "$worktree" config user.name 'github-actions[bot]'
          git -C "$worktree" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$worktree" commit -m 'chore(metrics): update download statistics'
          git -C "$worktree" push origin HEAD:download-metrics

      - name: Summarize totals
        run: |
          node -e '
            const stats = require("/tmp/download-metrics-output/download-stats.json");
            const summary = process.env.GITHUB_STEP_SUMMARY;
            const feedDates = Object.keys(stats.feedDaily ?? {}).sort();
            const latestFeedDate = feedDates[feedDates.length - 1];
            require("node:fs").appendFileSync(summary,
              `### Downloads ${stats.total.toLocaleString()}\n` +
              `- GitHub Releases: ${stats.githubTotal.toLocaleString()}\n` +
              `- Cloudflare mirror: ${stats.cloudflareTotal.toLocaleString()}\n` +
              (latestFeedDate
                ? `- Feed clients ${latestFeedDate}: ${stats.feedDaily[latestFeedDate].uniques.toLocaleString()} unique IPs\n`
                : ""));
          '
