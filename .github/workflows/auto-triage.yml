name: Auto Triage

# Codex replacement for the old Claude routine:
# - schedule / workflow_dispatch: scan recent activity
# - owner mention: handle only the mentioned issue or PR
# - new external issue / completed PR CI: handle only that item as untrusted intake

on:
  schedule:
    - cron: '8 5 * * *'
    - cron: '8 17 * * *'
  workflow_dispatch:
  issues:
    types: [opened, reopened]
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, review_requested]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  triage:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.issue.user.login != 'Lapis0x0'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        !startsWith(github.event.pull_request.title, '[auto-triage]') &&
        !startsWith(github.event.pull_request.head.ref, 'auto-triage/') &&
        !contains(github.event.pull_request.body || '', 'auto-triage: skip') &&
        (
          github.event.action != 'review_requested' ||
          github.event.requested_reviewer.login == 'Lapis0x1'
        )
      ) ||
      (
        github.event.sender.type != 'Bot' &&
        (
          contains(github.event.comment.body, '@Lapis0x1') ||
          contains(github.event.review.body, '@Lapis0x1')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.YOLO_BOT_GH_TOKEN }}

      - name: Check auto-triage skip rules
        id: skip-label
        env:
          GH_TOKEN: ${{ secrets.YOLO_BOT_GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || github.event.issue.number || github.event.pull_request.number || '' }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          CI_HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login || '' }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          SKIP_LABEL: no-auto-triage
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" && -z "$NUMBER" ]]; then
            prs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f head="$CI_HEAD_OWNER:$CI_HEAD_BRANCH")
            NUMBER=$(jq -r --arg sha "$CI_HEAD_SHA" \
              'map(select(.head.sha == $sha)) | .[0].number // empty' <<< "$prs")
          fi

          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          if [[ -z "$NUMBER" ]]; then
            if [[ "$EVENT_NAME" == "workflow_run" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          skip=false
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
            title=$(jq -r '.title' <<< "$pr_json")
            head_ref=$(jq -r '.head.ref' <<< "$pr_json")
            head_sha=$(jq -r '.head.sha' <<< "$pr_json")
            body=$(jq -r '.body // ""' <<< "$pr_json")
            state=$(jq -r '.state' <<< "$pr_json")
            draft=$(jq -r '.draft' <<< "$pr_json")

            if [[ "$head_sha" != "$CI_HEAD_SHA" ||
                  "$state" != "open" ||
                  "$draft" == "true" ||
                  "$title" == "[auto-triage]"* ||
                  "$head_ref" == auto-triage/* ||
                  "$body" == *"auto-triage: skip"* ]]; then
              skip=true
            fi
          fi

          while IFS= read -r label; do
            if [[ "$label" == "$SKIP_LABEL" ]]; then
              skip=true
              break
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.labels[].name')

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then
            echo "Skipping auto triage for #$NUMBER."
          fi

      - name: Use Node.js
        if: steps.skip-label.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Codex config
        if: steps.skip-label.outputs.skip != 'true'
        env:
          YOLO_CODEX_API_KEY: ${{ secrets.YOLO_CODEX_API_KEY }}
          YOLO_CODEX_BASE_URL: ${{ secrets.YOLO_CODEX_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$YOLO_CODEX_API_KEY"
          test -n "$YOLO_CODEX_BASE_URL"
          mkdir -p "$HOME/.codex"
          {
            printf '%s\n' 'model_provider = "custom"'
            printf '%s\n' 'disable_response_storage = true'
            printf '%s\n' '[model_providers.custom]'
            printf '%s\n' 'name = "custom"'
            printf '%s\n' 'wire_api = "responses"'
            printf '%s\n' 'requires_openai_auth = true'
            printf 'base_url = "%s"\n' "$YOLO_CODEX_BASE_URL"
            printf 'experimental_bearer_token = "%s"\n' "$YOLO_CODEX_API_KEY"
            printf '%s\n' '[projects."/"]'
            printf '%s\n' 'trust_level = "trusted"'
          } > "$HOME/.codex/config.toml"
          chmod 600 "$HOME/.codex/config.toml"

      - name: Install Codex and gh
        if: steps.skip-label.outputs.skip != 'true'
        run: |
          set -euo pipefail
          npm install -g @openai/codex@0.139.0
          if ! command -v gh >/dev/null 2>&1; then
            type -p curl >/dev/null || sudo apt-get update -qq
            type -p curl >/dev/null || sudo apt-get install -y curl
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg |
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" |
              sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y gh
          fi
          codex --version
          gh --version | head -1

      - name: Configure GitHub identity
        if: steps.skip-label.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.YOLO_BOT_GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "Lapis0x1"
          git config user.email "Lapis0x1@users.noreply.github.com"
          gh auth setup-git
          gh auth status

      - name: Build prompt
        if: steps.skip-label.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.YOLO_BOT_GH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.skip-label.outputs.number }}
          AUTHOR: ${{ github.event.sender.login || '' }}
          BODY: ${{ github.event.comment.body || github.event.review.body || github.event.issue.body || github.event.pull_request.body || '' }}
          URL: ${{ github.event.comment.html_url || github.event.review.html_url || github.event.issue.html_url || github.event.pull_request.html_url || '' }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          CI_URL: ${{ github.event.workflow_run.html_url || '' }}
        run: |
          set -euo pipefail
          TRIGGER_KIND="routine_scan"
          if [[ "$EVENT_NAME" == "issues" ]]; then
            TRIGGER_KIND="intake_issue"
          elif [[ "$EVENT_NAME" == "pull_request_target" || "$EVENT_NAME" == "workflow_run" ]]; then
            TRIGGER_KIND="intake_pr"
          elif [[ "$AUTHOR" == "Lapis0x0" ]]; then
            TRIGGER_KIND="owner_command"
          elif [[ "$EVENT_NAME" != "schedule" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            TRIGGER_KIND="user_mention"
          fi

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            pr_json=$(gh api "repos/$REPO/pulls/$NUMBER")
            AUTHOR=$(jq -r '.user.login' <<< "$pr_json")
            BODY=$(jq -r '.body // ""' <<< "$pr_json")
            URL=$(jq -r '.html_url' <<< "$pr_json")
          fi

          cp .github/prompts/obsidian-yolo-auto-triage.md /tmp/auto-triage-prompt.md
          {
            printf '\n\n<routine-fire-payload>\n'
            jq -n \
              --arg trigger_kind "$TRIGGER_KIND" \
              --arg event_name "$EVENT_NAME" \
              --arg repo "$REPO" \
              --arg number "$NUMBER" \
              --arg author "$AUTHOR" \
              --arg body "$BODY" \
              --arg url "$URL" \
              --arg ci_conclusion "$CI_CONCLUSION" \
              --arg ci_head_sha "$CI_HEAD_SHA" \
              --arg ci_url "$CI_URL" \
              '{
                trigger_kind: $trigger_kind,
                event_name: $event_name,
                repo: $repo,
                number: $number,
                url: $url,
                author: $author,
                body: $body,
                ci: {
                  conclusion: $ci_conclusion,
                  head_sha: $ci_head_sha,
                  url: $ci_url
                }
              }'
            printf '\n</routine-fire-payload>\n'
          } >> /tmp/auto-triage-prompt.md

      - name: Run Codex triage
        if: steps.skip-label.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.YOLO_BOT_GH_TOKEN }}
        run: |
          set -euo pipefail
          codex exec \
            --model gpt-5.6-terra \
            --sandbox danger-full-access \
            --cd "$GITHUB_WORKSPACE" \
            - < /tmp/auto-triage-prompt.md
